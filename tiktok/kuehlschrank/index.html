<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>So funktioniert ein Kühlschrank</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/words.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-800.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #e9a7c4;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e9a7c4;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #captions {
        position: absolute;
        left: 0;
        right: 0;
        top: 900px;
        height: 120px;
      }
      .word {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        text-align: center;
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 78px;
        line-height: 120px;
        color: #ffffff;
        opacity: 0;
        -webkit-text-stroke: 7px rgba(20, 12, 30, 0.55);
        paint-order: stroke fill;
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.55),
          0 3px 6px rgba(0, 0, 0, 0.45),
          0 0 18px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="63"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="stage" width="720" height="1280"></canvas>
      <div id="captions"></div>
    </div>

    <script>
      // One word at a time, hard swap, fixed center position (reference style).
      (function () {
        const words = window.HF_WORDS;
        const box = document.getElementById("captions");
        const tl = gsap.timeline({ paused: true });
        words.forEach((w, i) => {
          const el = document.createElement("div");
          el.className = "word";
          el.textContent = w.w;
          box.appendChild(el);
          const next = words[i + 1];
          const off = next ? Math.min(next.start, w.end + 0.6) : w.end + 0.8;
          tl.set(el, { opacity: 1 }, w.start);
          tl.set(el, { opacity: 0 }, off);
        });
        tl.set({}, {}, 63);
        window.__timelines["main"] = tl;
      })();
    </script>

    <script type="module" src="assets/scene.js"></script>
  </body>
</html>
